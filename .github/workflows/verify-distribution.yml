name: Verify TEST v4 from external network
on:
  workflow_dispatch:
permissions: {}
jobs:
  public-network-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download, verify signature, access page and live backend
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,pathlib,hashlib,zipfile,json,subprocess,os,glob,re,time,datetime
          report={'network':'GitHub hosted Ubuntu runner, independent of developer computer','physicalAndroid':False,'participantCredentialsUsed':False,'apkRecompiled':False,'at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          url='https://github.com/Gonman17/agarapp-test-downloads/releases/download/test-v4/AGARAPP-TEST-v4-a263e66f2c96.apk'
          p=pathlib.Path('AGARAPP-TEST-v4.apk');digest=hashlib.sha256();size=0
          with urllib.request.urlopen(url,timeout=120) as r, p.open('wb') as f:
           assert r.status==200
           while True:
            b=r.read(1048576)
            if not b:break
            size+=len(b);digest.update(b);f.write(b)
          assert size==66345248 and digest.hexdigest()=='a263e66f2c96177f98edf4782ba756322a36abfc34ce51d9c2bd9ab83b689eb5'
          with zipfile.ZipFile(p) as z:assert z.testzip() is None
          sdk=pathlib.Path(os.environ.get('ANDROID_HOME',os.environ.get('ANDROID_SDK_ROOT','/usr/local/lib/android/sdk')))
          tools=sorted(sdk.glob('build-tools/*/apksigner'));assert tools,'Official Android build-tools missing'
          sig=subprocess.run([str(tools[-1]),'verify','--verbose','--print-certs',str(p)],capture_output=True,text=True,check=True).stdout
          assert 'e6a6489ee864c445ecb963495007d84d16094eb49fa0ab7ac959f91474f48949' in sig
          badging=subprocess.run([str(tools[-1].parent/'aapt2'),'dump','badging',str(p)],capture_output=True,text=True,check=True).stdout
          assert "name='ar.agara.agarapp.dueltest'" in badging and "versionCode='4'" in badging and "versionName='1.0.4-test'" in badging
          report['apkDownloadedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          report['APK']={'bytes':size,'sha256':digest.hexdigest(),'signatureVerified':True,'package':'ar.agara.agarapp.dueltest','versionCode':4,'versionName':'1.0.4-test'}
          page='https://gonman17.github.io/agarapp-test-downloads/'
          for i in range(24):
           try:
            with urllib.request.urlopen(page,timeout=20) as r:html=r.read().decode();assert r.status==200 and 'AGARAPP TEST v4' in html
            with urllib.request.urlopen(page+'app.js',timeout=20) as r:js=r.read().decode();assert 'agarapp-dueltest://ingresar?' in js and 'location.hash' in js and 'intent://ingresar?' in js
            assert 'trycloudflare.com' not in html and 'fetch(' not in js;break
           except Exception:
            if i==23:raise
            time.sleep(10)
          report['stableAccessPage']={'httpsStatus':200,'nativeMechanismPresent':True,'temporaryPageDependency':False,'personalFragmentNotSentToServer':True}
          config='https://api.github.com/gists/f1b12d22f5714ae6efb4e1227486686c'
          with urllib.request.urlopen(urllib.request.Request(config+'?external='+str(time.time()),headers={'accept':'application/vnd.github+json'}),timeout=30) as r:d=json.load(r)
          assert d['id']=='f1b12d22f5714ae6efb4e1227486686c' and d['owner']['id']==214735205
          content=d['files']['agarapp-test.json']['content'];assert hashlib.sha256(content.encode()).hexdigest()==d['files']['agarapp-test.sha256']['content'];c=json.loads(content);assert c['environment']=='TEST' and c['backendId']=='localduel1v1test0000';assert re.fullmatch(r'https://[a-z0-9]+(?:-[a-z0-9]+){1,8}\.trycloudflare\.com',c['origin']);assert datetime.datetime.fromisoformat(c['expiresAt'])>datetime.datetime.now(datetime.timezone.utc)
          report['initialBackendGeneration']=c['generation']
          report['healthFailuresBeforeRecovery']=0
          for i in range(18):
           try:
            with urllib.request.urlopen(urllib.request.Request(config+'?retry='+str(time.time()),headers={'accept':'application/vnd.github+json'}),timeout=20) as current_response: current_document=json.load(current_response)
            assert current_document['owner']['id']==214735205
            current_content=current_document['files']['agarapp-test.json']['content'];assert hashlib.sha256(current_content.encode()).hexdigest()==current_document['files']['agarapp-test.sha256']['content'];c=json.loads(current_content);assert c['environment']=='TEST' and c['backendId']=='localduel1v1test0000' and re.fullmatch(r'https://[a-z0-9]+(?:-[a-z0-9]+){1,8}\.trycloudflare\.com',c['origin'])
            with urllib.request.urlopen(c['origin']+'/health',timeout=20) as r:h=json.load(r);assert r.status==200 and h['test'] and h['restricted'] and h['backendReady'];break
           except Exception:
            report['healthFailuresBeforeRecovery']+=1
            if i==17:raise
            time.sleep(10)
          try:
           urllib.request.urlopen(urllib.request.Request(c['origin']+'/auth/v1/test-access',data=b'{}',headers={'content-type':'application/json'}),timeout=20)
           raise AssertionError('Missing personal ticket must fail')
          except urllib.error.HTTPError as e:
           assert e.code==400 and json.load(e)['code']=='invalid_test_access'
          try:
           urllib.request.urlopen(urllib.request.Request(c['origin']+'/rest/v1/rpc/activity_rival_capabilities',data=b'{}',headers={'content-type':'application/json'}),timeout=20)
           raise AssertionError('Anonymous RPC must fail')
          except urllib.error.HTTPError as e:assert e.code==401
          report['backend']={'httpsStatus':200,'backendReady':True,'generation':c['generation'],'invalidPersonalAccessRejected':True,'anonymousRPCRejected':True,'authenticatedParticipantLogin':'not tested from runner: no private credentials supplied'}
          report['success']=True
          print('EXTERNAL_VERIFICATION_JSON='+json.dumps(report,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## External TEST v4 verification\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
          PY
